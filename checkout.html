<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Satyabhama Decors & Interiors</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body{font-family:sans-serif;max-width:560px;margin:0 auto;padding:24px;color:#2A1A0E;}
  h1{font-size:22px;margin-bottom:16px;}
  .cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;}
  .cart-item small{display:block;color:#777;}
  .totals{margin:16px 0;padding:14px;background:#F0E8D8;border-radius:8px;}
  .totals div{display:flex;justify-content:space-between;margin:4px 0;}
  form input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;}
  button{width:100%;padding:14px;background:#C1522A;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin-top:12px;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  #dueLaterNote{font-size:12px;color:#9E3E1A;margin-top:6px;}
  #errorBox{color:#b00020;font-size:14px;margin-top:8px;display:none;}
</style>
</head>
<body>

<h1>Checkout</h1>
<div id="cartItems"></div>

<div class="totals">
  <div><span>Pay now</span><span id="payNow">₹0</span></div>
  <div id="dueLaterRow" style="display:none;"><span>Balance (after measurement)</span><span id="dueLater">TBD</span></div>
</div>

<form id="checkoutForm">
  <input type="text" id="name" placeholder="Full name" required>
  <input type="tel" id="phone" placeholder="Phone number" required pattern="[0-9]{10}">
  <input type="email" id="email" placeholder="Email (optional)">
  <input type="text" id="address" placeholder="Address" required>
  <input type="text" id="pincode" placeholder="Pincode" required>
  <button type="submit" id="payBtn">Pay & Confirm Order</button>
  <div id="errorBox"></div>
</form>

<script type="module">
  import { getCart, getCartTotals, clearCart } from "/cart.js";

  const cart = getCart();
  const { payNow, dueLater } = getCartTotals();

  const cartItemsEl = document.getElementById("cartItems");
  cart.forEach(item => {
    const div = document.createElement("div");
    div.className = "cart-item";
    if (item.fulfillment_type === "direct") {
      div.innerHTML = `<span>${item.name} × ${item.quantity}</span><span>₹${(item.unit_price * item.quantity).toFixed(2)}</span>`;
    } else {
      div.innerHTML = `<span>${item.name} <small>Booking deposit — final price after home visit</small></span><span>₹${item.deposit_amount.toFixed(2)}</span>`;
    }
    cartItemsEl.appendChild(div);
  });

  document.getElementById("payNow").textContent = `₹${payNow.toFixed(2)}`;
  if (cart.some(i => i.fulfillment_type === "quote_deposit")) {
    document.getElementById("dueLaterRow").style.display = "flex";
    document.getElementById("dueLater").textContent = "Confirmed after home visit";
  }

  document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payBtn = document.getElementById("payBtn");
    const errorBox = document.getElementById("errorBox");
    errorBox.style.display = "none";
    payBtn.disabled = true;
    payBtn.textContent = "Processing...";

    const customer = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      address: document.getElementById("address").value,
      pincode: document.getElementById("pincode").value,
    };

    try {
      const res = await fetch("/api/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ customer, items: cart }),
      });
      const orderData = await res.json();
      if (!res.ok) throw new Error(orderData.error || "Order creation failed");

      const rzp = new Razorpay({
        key: orderData.key_id,
        amount: orderData.amount,
        currency: orderData.currency,
        name: "Satyabhama Decors & Interiors",
        description: "Order payment",
        order_id: orderData.razorpay_order_id,
        prefill: { name: customer.name, contact: customer.phone, email: customer.email },
        handler: async function (response) {
          const verifyRes = await fetch("/api/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              supabase_order_id: orderData.supabase_order_id,
            }),
          });
          const verifyData = await verifyRes.json();
          if (verifyData.verified) {
            clearCart();
            window.location.href = "/order-confirmed.html?order=" + orderData.supabase_order_id;
          } else {
            errorBox.textContent = "Payment could not be verified. Please contact us with your payment ID.";
            errorBox.style.display = "block";
          }
        },
        modal: {
          ondismiss: function () {
            payBtn.disabled = false;
            payBtn.textContent = "Pay & Confirm Order";
          }
        },
        theme: { color: "#C1522A" },
      });

      rzp.open();
    } catch (err) {
      errorBox.textContent = err.message || "Something went wrong. Please try again.";
      errorBox.style.display = "block";
      payBtn.disabled = false;
      payBtn.textContent = "Pay & Confirm Order";
    }
  });
</script>
</body>
</html>
